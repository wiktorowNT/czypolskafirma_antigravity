<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background: #334155; display: flex; justify-content: center; padding: 40px; }
  .canvas { width: 1080px; height: 1080px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #0f172a; }
  .stamp { display: inline-block; padding: 0.5rem 1rem; text-transform: uppercase; border: 8px solid; border-radius: 12px; font-weight: 900; font-size: 5rem; line-height: 1; opacity: 0.9; transform: rotate(-15deg); position: absolute; z-index: 50; top: 30%; right: 10%; pointer-events: none; }
  .stamp-red { color: #ef4444; border-color: #ef4444; }
  .stamp-green { color: #22c55e; border-color: #22c55e; transform: rotate(10deg); top: 30%; left: 10%; }
</style>
</head>
<body>
<div class="canvas shadow-2xl rounded-xl">
  
  <!-- GÓRNY PANEL: MIT -->
  <div class="h-1/2 bg-slate-100 flex items-center p-16 relative overflow-hidden">
    <!-- Tło wzór -->
    <div class="absolute inset-0 opacity-5" style="background-image: radial-gradient(#ef4444 2px, transparent 2px); background-size: 30px 30px;"></div>
    
    <div class="w-1/3 flex justify-center z-10">
       <div class="w-64 h-64 bg-white rounded-3xl shadow-xl border-4 border-slate-200 flex items-center justify-center text-slate-400 font-bold text-xl">[Oshee]</div>
    </div>
    
    <div class="w-2/3 pl-12 z-10">
      <div class="text-slate-500 font-black uppercase tracking-widest text-xl mb-2 flex items-center gap-3">
        Wszyscy myślą, że to Polskie
      </div>
      <h1 class="text-6xl font-black text-slate-900 mb-6 leading-tight">Oshee nie jest do końca polskie</h1>
      
      <div class="bg-white inline-flex items-center gap-6 px-8 py-4 rounded-2xl shadow-md border-l-8 border-red-500">
        <img src="https://flagcdn.com/w80/cy.png" class="h-12 border border-slate-200 rounded shadow-sm">
        <div>
          <div class="text-sm font-bold text-slate-400 uppercase tracking-widest">Właściciel / Kapitał</div>
          <div class="text-2xl font-black text-slate-800">Cypryjski Fundusz</div>
        </div>
      </div>
    </div>

    <!-- STEMPEL FAŁSZ -->
    <div class="stamp stamp-red shadow-sm backdrop-blur-sm">MIT!</div>
  </div>

  <div class="h-2 bg-slate-900 w-full relative z-20"></div>

  <!-- DOLNY PANEL: PRAWDA -->
  <div class="h-1/2 bg-slate-900 flex items-center p-16 relative overflow-hidden flex-row-reverse">
    <!-- Tło wzór -->
    <div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(#22c55e 2px, transparent 2px); background-size: 30px 30px;"></div>

    <div class="w-1/3 flex justify-center z-10">
       <div class="w-64 h-64 bg-slate-800 rounded-3xl shadow-xl border-4 border-green-500/30 flex items-center justify-center text-slate-600 font-bold text-xl relative">
          <div class="absolute -top-4 -right-4 bg-green-500 rounded-full w-12 h-12 flex items-center justify-center border-4 border-slate-900">
             <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"></path></svg>
          </div>
          [DrWitt]
       </div>
    </div>
    
    <div class="w-2/3 pr-12 z-10 text-right">
      <div class="text-green-500 font-black uppercase tracking-widest text-xl mb-2 flex items-center justify-end gap-3">
        Zamiast tego wybierz
      </div>
      <h1 class="text-6xl font-black text-white mb-6 leading-tight">DrWitt to 100% polski kapitał</h1>
      
      <div class="bg-slate-800 inline-flex items-center flex-row-reverse gap-6 px-8 py-4 rounded-2xl shadow-md border-r-8 border-green-500">
        <img src="https://flagcdn.com/w80/pl.png" class="h-12 border border-slate-700 rounded shadow-sm">
        <div class="text-left">
          <div class="text-sm font-bold text-slate-400 uppercase tracking-widest">Właściciel / Kapitał</div>
          <div class="text-2xl font-black text-white">Maspex (Polska)</div>
        </div>
      </div>
    </div>

    <!-- STEMPEL PRAWDA -->
    <div class="stamp stamp-green shadow-sm backdrop-blur-sm">FAKT!</div>
  </div>

  <!-- CENTRALNE LOGO CZYPOLSKAFIRMA -->
  <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white rounded-full p-4 shadow-2xl z-50 border-4 border-slate-100 flex items-center gap-3">
    <img src="https://flagcdn.com/w80/pl.png" class="h-8 rounded">
    <span class="font-black text-slate-900 text-xl tracking-tight">CzyPolskaFirma.pl</span>
  </div>

</div>
</body>
</html>
