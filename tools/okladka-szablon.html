<!doctype html>
<!--
  Szablon okładki wpisu blogowego (1200x630, og:image) — system „Półka” (docs/DESIGN_SYSTEM.md).
  Wypełniany przez tools/okladka-wpisu.mjs, nie edytuj placeholderów {{...}}.
  Plik roboczy powstaje w public/images/blog/, stąd ścieżka do logo ../../logo.png.
  Font Manrope ładowany z Google Fonts (latin-ext), żeby render na Windowsie i na runnerze
  GitHuba wyglądał tak samo.
-->
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    background: #f6f3ee;
    color: #1f1d1a;
    font-family: Manrope, "Liberation Sans", Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 64px 80px 60px;
  }

  .marka { display: flex; align-items: center; gap: 14px; }
  .marka img { width: 46px; height: 46px; object-fit: contain; }
  .marka span { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .marka .domena { color: #6b665e; font-weight: 700; }

  .tresc { margin-top: auto; margin-bottom: auto; padding-top: 18px; }

  h1 {
    font-weight: 800;
    font-size: 72px;
    line-height: 1.06;
    letter-spacing: -0.035em;
    max-width: 1040px;
  }
  h1 .akcent { color: #c2381f; }

  .podtytul {
    margin-top: 20px;
    font-size: 27px;
    font-weight: 600;
    line-height: 1.35;
    color: #6b665e;
    max-width: 980px;
  }

  .staty { display: flex; gap: 14px; }
  .stat {
    background: #ffffff;
    border: 2px solid #e4dfd6;
    border-radius: 22px;
    padding: 18px 26px 16px;
    min-width: 230px;
  }
  .stat-wartosc { font-size: 36px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .stat-opis { margin-top: 4px; font-size: 16px; font-weight: 600; color: #6b665e; }
  .staty:empty { display: none; }

  /* Dłuższe tytuły same schodzą o stopień, żeby nie wyjść poza kadr. */
  body.dlugi h1 { font-size: 60px; }
  body.bardzo-dlugi h1 { font-size: 52px; }
  body.bardzo-dlugi .podtytul { font-size: 24px; }
</style>
</head>
<body class="{{KLASA_DLUGOSCI}}">
  <div class="marka">
    <img src="../../logo.png" alt="">
    <span>CzyPolskaFirma<span class="domena">.pl</span></span>
  </div>

  <div class="tresc">
    <h1>{{TYTUL}}</h1>
    <p class="podtytul">{{PODTYTUL}}</p>
  </div>

  <div class="staty">{{STATY}}</div>
</body>
</html>
