<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Fixer Standalone - CzyPolskaFirma.pl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const DEFAULT_DOMAINS = "amica.pl,benix.pl,c-and-a.com,calzedonia.com,carlsbergpolska.pl,cellnex.com,clochee.com,chatapolska.pl,comforty.pl,continental-opony.pl,credit-agricole.pl,com40.pl,dax.com.pl,delia.pl,develia.pl,drirenaeris.com,lilly.com.pl,dunagroup.com,esteelauder.pl,exatel.pl,eveline.pl,ferrari.com,garmin.com,maspex.com,goldbeck.pl,haleon.com,honda.pl,inea.pl,ikea.com,intimissimi.com,janpol.pl,jeep.pl,kajima.pl,kia.com,kgsa.pl,lancerto.com,levi.com,makemebio.com,massimodutti.com,mazda.pl,manta.eu,mdd.pl,mieszko.pl,miquido.com,miraculum.pl,mohito.com,modecom.com,mokate.com.pl,mokosh.pl,mondelezinternational.com,morele.net,ndi.pl,opel.pl,oracle.com,orange.pl,prymat.pl,puccini.pl,pullandbear.com,seat.pl,stokrotka.pl,tarczynski.pl,tatuum.com,tonsil.pl,teva.pl,toya.net.pl,virginmobile.pl,voice-net.pl,whirlpool.pl,wilk-elektronik.pl,x-kom.pl,wittchen.com,wolczanka.pl,zabkagroup.com,zortrax.com,zara.com";

        function LogoFixer() {
            const [domains, setDomains] = useState([]);
            const [inputText, setInputText] = useState("");
            const [status, setStatus] = useState({});

            useEffect(() => {
                const saved = localStorage.getItem('logoFixerDomains');
                if (saved) {
                    const list = saved.split(',').map(d => d.trim()).filter(Boolean);
                    setDomains(list);
                    setInputText(saved);
                } else {
                    setDomains(DEFAULT_DOMAINS.split(','));
                    setInputText(DEFAULT_DOMAINS);
                }
            }, []);

            const handleUpdateList = () => {
                const list = inputText.split(',').map(d => d.trim()).filter(Boolean);
                setDomains(list);
                localStorage.setItem('logoFixerDomains', list.join(','));
            };

            const getDomainFromUrl = (url) => {
                if (!url) return "";
                try {
                    const clean = url.trim();
                    const withProtocol = clean.startsWith('http') ? clean : `https://${clean}`;
                    const urlObj = new URL(withProtocol);
                    return urlObj.hostname.replace(/^www\./, '');
                } catch (e) {
                    return url.replace(/\/+$/, '').replace(/^https?:\/\//, '').replace(/^www\./, '');
                }
            };

            const uploadFile = async (file, rawDomain) => {
                const domain = getDomainFromUrl(rawDomain);
                if (!domain) {
                    alert("Nieprawidłowa domena!");
                    return;
                }

                setStatus(prev => ({ ...prev, [rawDomain]: 'uploading' }));
                
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    try {
                        const res = await fetch('http://localhost:3005/api/upload', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                domain,
                                fileBase64: reader.result,
                                fileName: file.name
                            }),
                        });
                        if (res.ok) {
                            setStatus(prev => ({ ...prev, [domain]: 'success' }));
                        } else {
                            setStatus(prev => ({ ...prev, [domain]: 'error' }));
                        }
                    } catch (err) {
                        console.error(err);
                        setStatus(prev => ({ ...prev, [domain]: 'error' }));
                        alert('Błąd: Upewnij się, że serwer pomocniczy (node tools/fixer-server.mjs) jest uruchomiony!');
                    }
                };
            };

            const handleDrop = (e, domain) => {
                e.preventDefault();
                const file = e.dataTransfer.files[0];
                if (file) uploadFile(file, domain);
            };

            return (
                <div className="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-8">
                    <h1 className="text-3xl font-bold text-gray-900 mb-2">Automatyczny Logo Fixer (Standalone)</h1>
                    <p className="text-gray-600 mb-8">
                        Narzędzie do szybkiej podmiany logotypów. Wymaga uruchomionego skryptu <code>node tools/fixer-server.mjs</code>.
                    </p>

                    <div className="mb-8 p-4 bg-blue-50 border border-blue-100 rounded-lg">
                        <h2 className="text-sm font-bold text-blue-900 mb-2">Edytuj listę firm</h2>
                        <textarea 
                            className="w-full text-sm border-gray-300 rounded p-2 h-24 focus:ring-blue-500 focus:border-blue-500 text-gray-800 font-mono"
                            value={inputText}
                            onChange={(e) => setInputText(e.target.value)}
                        />
                        <button 
                            onClick={handleUpdateList}
                            className="mt-3 bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-blue-700 transition-colors"
                        >
                            Aktualizuj listę
                        </button>
                    </div>

                    <div className="space-y-4">
                        {domains.map((domain) => (
                            <div key={domain} className="flex items-center justify-between p-4 bg-gray-50 rounded-lg border border-gray-100">
                                <div className="w-1/3">
                                    <div className="font-semibold text-lg">{domain}</div>
                                    <div className="flex gap-2 mt-2">
                                        <a href={`https://brandfetch.com/${domain}`} target="_blank" className="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded">Brandfetch</a>
                                        <a href={`https://worldvectorlogo.com/search?q=${domain.split('.')[0]}`} target="_blank" className="text-xs bg-purple-100 text-purple-700 px-2 py-1 rounded">WVL</a>
                                    </div>
                                </div>
                                <div className="w-2/3 flex items-center gap-4">
                                    <div 
                                        className={`flex-1 border-2 border-dashed rounded-lg p-4 text-center cursor-pointer
                                            ${status[domain] === 'success' ? 'border-green-400 bg-green-50' : 
                                              status[domain] === 'error' ? 'border-red-400 bg-red-50' : 'border-gray-300'}`}
                                        onDragOver={e => e.preventDefault()}
                                        onDrop={e => handleDrop(e, domain)}
                                        onClick={() => document.getElementById(`file-${domain}`).click()}
                                    >
                                        {status[domain] === 'uploading' ? 'Wgrywanie...' : 
                                         status[domain] === 'success' ? '✅ Zapisano!' : 
                                         status[domain] === 'error' ? '❌ Błąd' : 'Przeciągnij plik lub kliknij'}
                                        <input 
                                            type="file" id={`file-${domain}`} className="hidden" 
                                            onChange={e => e.target.files[0] && uploadFile(e.target.files[0], domain)}
                                        />
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LogoFixer />);
    </script>
</body>
</html>
