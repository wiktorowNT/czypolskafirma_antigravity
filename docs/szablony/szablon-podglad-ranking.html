<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background: #334155; display: flex; justify-content: center; padding: 40px; }
  .canvas { width: 1080px; height: 1080px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #ffffff; }
</style>
</head>
<body>
<div class="canvas shadow-2xl rounded-xl">
  
  <!-- NAGŁÓWEK -->
  <div class="bg-slate-900 text-white p-12 flex justify-between items-end border-b-8 border-red-500">
    <div>
      <div class="text-red-400 font-bold tracking-widest uppercase text-xl mb-2">Ranking Kapitału</div>
      <h1 class="text-5xl font-black uppercase tracking-tight">Kto kontroluje Ketchup?</h1>
    </div>
    <div class="text-right">
      <img src="https://flagcdn.com/w80/pl.png" class="h-10 rounded opacity-90 inline-block mb-2">
      <div class="text-slate-400 font-bold uppercase tracking-widest text-sm">CzyPolskaFirma.pl</div>
    </div>
  </div>

  <!-- LISTA / RANKING -->
  <div class="flex-1 p-12 flex flex-col justify-center gap-6 bg-slate-50">
    
    <!-- MIEJSCE 1 (POLSKA) -->
    <div class="bg-white rounded-2xl flex items-stretch border-2 border-green-500 shadow-2xl shadow-green-100 overflow-hidden relative transform scale-105 z-10">
      <div class="w-32 bg-green-500 flex flex-col items-center justify-center text-white p-4">
        <span class="text-sm font-bold uppercase tracking-widest mb-1 opacity-80">Wybór</span>
        <span class="text-5xl font-black">#1</span>
      </div>
      <div class="w-48 bg-slate-100 flex items-center justify-center border-r border-slate-200">
        <span class="text-slate-400 font-bold">[Zdjęcie]</span>
      </div>
      <div class="flex-1 p-8 flex items-center justify-between">
        <div>
          <h2 class="text-5xl font-black text-slate-900 mb-2">Włocławek</h2>
          <div class="text-xl text-slate-500 font-medium">Agros Nova</div>
        </div>
        <div class="text-right flex items-center gap-6">
          <div>
            <div class="text-sm font-bold text-green-600 uppercase tracking-widest mb-1">Kapitał</div>
            <div class="text-3xl font-black text-green-700 uppercase">Polska</div>
          </div>
          <img src="https://flagcdn.com/w80/pl.png" class="h-16 rounded shadow-md border border-slate-200">
        </div>
      </div>
    </div>

    <!-- MIEJSCE 2 (ZAGRANICA) -->
    <div class="bg-white rounded-2xl flex items-stretch border border-slate-200 shadow-sm overflow-hidden mt-4">
      <div class="w-32 bg-slate-800 flex flex-col items-center justify-center text-white p-4">
        <span class="text-5xl font-black opacity-30">#2</span>
      </div>
      <div class="w-48 bg-slate-50 flex items-center justify-center border-r border-slate-100">
        <span class="text-slate-300 font-bold">[Zdjęcie]</span>
      </div>
      <div class="flex-1 p-8 flex items-center justify-between">
        <div>
          <h2 class="text-4xl font-bold text-slate-800 mb-1">Pudliszki</h2>
          <div class="text-lg text-slate-500">Kraft Heinz</div>
        </div>
        <div class="text-right flex items-center gap-6 opacity-80">
          <div>
            <div class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Kapitał</div>
            <div class="text-2xl font-bold text-slate-700 uppercase">USA</div>
          </div>
          <img src="https://flagcdn.com/w80/us.png" class="h-12 rounded border border-slate-200">
        </div>
      </div>
    </div>

    <!-- MIEJSCE 3 (ZAGRANICA) -->
    <div class="bg-white rounded-2xl flex items-stretch border border-slate-200 shadow-sm overflow-hidden">
      <div class="w-32 bg-slate-800 flex flex-col items-center justify-center text-white p-4">
        <span class="text-5xl font-black opacity-30">#3</span>
      </div>
      <div class="w-48 bg-slate-50 flex items-center justify-center border-r border-slate-100">
        <span class="text-slate-300 font-bold">[Zdjęcie]</span>
      </div>
      <div class="flex-1 p-8 flex items-center justify-between">
        <div>
          <h2 class="text-4xl font-bold text-slate-800 mb-1">Tortex</h2>
          <div class="text-lg text-slate-500">Unilever</div>
        </div>
        <div class="text-right flex items-center gap-6 opacity-80">
          <div>
            <div class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Kapitał</div>
            <div class="text-2xl font-bold text-slate-700 uppercase">Wlk. Brytania</div>
          </div>
          <img src="https://flagcdn.com/w80/gb.png" class="h-12 rounded border border-slate-200">
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
