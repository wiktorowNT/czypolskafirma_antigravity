<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background: #e2e8f0; display: flex; justify-content: center; padding: 40px; }
  .canvas { width: 1080px; height: 1080px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #ffffff; }
  .logo-container { width: 280px; height: 280px; display: flex; align-items: center; justify-content: center; border-radius: 40px; background: white; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); }
</style>
</head>
<body>
<div class="canvas shadow-2xl rounded-xl border border-slate-200">
  
  <!-- NAGŁÓWEK -->
  <div class="bg-[#0f172a] text-white p-12 text-center relative border-b-[8px] border-[#dc143c]">
    <div class="text-[#dc143c] font-black tracking-widest uppercase text-2xl mb-2">Pojedynek Dyskontów</div>
    <h1 class="text-6xl font-black uppercase tracking-tight">Gdzie robisz codzienne zakupy?</h1>
  </div>

  <!-- KONTENT - PORÓWNANIE -->
  <div class="flex-1 flex bg-slate-50 relative">
    
    <!-- ZAGRANICA (Lewa) -->
    <div class="flex-1 flex flex-col items-center justify-center p-12 relative border-r-2 border-slate-200 border-dashed">
      
      <!-- Logo -->
      <div class="logo-container border-4 border-slate-200 mb-10 relative">
        <span class="text-3xl font-black text-slate-300 uppercase">[Logo Biedronka]</span>
      </div>

      <!-- Detale -->
      <h2 class="text-5xl font-black text-slate-900 mb-4">Biedronka</h2>
      <div class="text-2xl text-slate-500 font-bold mb-12">Jeronimo Martins</div>

      <!-- Wynik Kapitału -->
      <div class="bg-white rounded-3xl w-full p-8 shadow-lg border-t-8 border-red-500 text-center flex items-center justify-between">
        <div class="text-left">
          <div class="text-red-500 font-black uppercase tracking-widest text-lg mb-1">Kapitał Zagraniczny</div>
          <div class="text-4xl font-black text-slate-900">Portugalia</div>
        </div>
        <img src="https://flagcdn.com/w160/pt.png" class="h-20 rounded-lg shadow-sm border border-slate-200">
      </div>
    </div>

    <!-- POLSKA (Prawa) -->
    <div class="flex-1 flex flex-col items-center justify-center p-12 relative bg-green-50/30">
      
      <!-- Logo -->
      <div class="logo-container border-4 border-green-400 mb-10 relative ring-8 ring-green-100">
        <div class="absolute -top-6 bg-green-500 text-white px-8 py-2 rounded-full font-black uppercase tracking-widest text-lg shadow-lg">100% Polskie</div>
        <span class="text-3xl font-black text-slate-300 uppercase">[Logo Dino]</span>
      </div>

      <!-- Detale -->
      <h2 class="text-5xl font-black text-slate-900 mb-4">Dino</h2>
      <div class="text-2xl text-slate-500 font-bold mb-12">Dino Polska S.A.</div>

      <!-- Wynik Kapitału -->
      <div class="bg-white rounded-3xl w-full p-8 shadow-xl border-t-8 border-green-500 text-center flex items-center justify-between">
        <div class="text-left">
          <div class="text-green-600 font-black uppercase tracking-widest text-lg mb-1">Kapitał Polski</div>
          <div class="text-4xl font-black text-green-900">Polska</div>
        </div>
        <img src="https://flagcdn.com/w160/pl.png" class="h-20 rounded-lg shadow-sm border border-slate-200">
      </div>
    </div>

    <!-- ZNACZEK VS NA ŚRODKU -->
    <div class="absolute top-[40%] left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-24 h-24 bg-white rounded-full border-4 border-slate-200 flex items-center justify-center text-slate-400 text-3xl font-black shadow-lg">
      VS
    </div>

  </div>

  <!-- STOPKA -->
  <div class="bg-white p-8 border-t-2 border-slate-100 flex justify-between items-center px-16">
    <div class="flex items-center gap-4">
      <img src="https://flagcdn.com/w80/pl.png" class="h-10 rounded shadow-sm border border-slate-200">
      <span class="text-3xl font-black text-slate-900">CzyPolskaFirma.pl</span>
    </div>
    <div class="text-slate-400 font-bold tracking-widest uppercase text-xl">Wybieraj mądrze</div>
  </div>

</div>
</body>
</html>
